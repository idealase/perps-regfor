[project]
name = "perps-forecaster"
version = "0.1.0"
description = "Short-term crypto regime forecasting using public Binance Futures APIs"
authors = [{name = "Brodie"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "arch>=6.2.0",
    "plotly>=5.17.0",
    "pyarrow>=13.0.0",
    "pytz>=2023.3",
    "lightgbm>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "black>=23.10.0",
    "pre-commit>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
